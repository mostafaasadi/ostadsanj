<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">

  <title>استادسنج — کارنامه استاد</title>

  <link rel="stylesheet" href="assets/css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>

    .ghost-btn {

      display: flex; align-items: center; gap: .6rem;
    }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(155px, 1fr)); gap: 1rem; }
    .stat-card {

    .stat-icon { width: 46px; height: 46px; border-radius: .85rem; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0; }
    .si-blue { background: #eff6ff; color: #2563eb; }

    .card-x { background: #fff; border: 1px solid var(--border, #e2e8f0); border-radius: 1rem; overflow: hidden; }

    .bp-green { background: #ecfdf5; color: #047857; } .bp-green .dot { background: #10b981; }

    .bp-amber { background: #fffbeb; color: #b45309; } .bp-amber .dot { background: #f59e0b; }

    .pr-banner {
      background: linear-gradient(135deg, #4338ca 0%, #7c3aed 55%, #a855f7 100%);

    table.pr-table { width: 100%; border-collapse: collapse; font-size: 8.5px; color: #111; }
    .pr-table th, .pr-table td { border: 1px solid #c2c8d4; padding: 2.5px 6px; text-align: right; vertical-align: middle; }
    .pr-table th { background: linear-gradient(135deg, #4338ca, #6d28d9); color: #fff; font-weight: 800; white-space: nowrap; font-size: 8px; }
    .pr-table tbody tr:nth-child(even) td { background: #f6f7fb; }
    .pr-score { font-weight: 800; }
    .pr-pill { display: inline-block; border-radius: 99px; padding: 1px 6px; font-size: 7.5px; font-weight: 700; }
    .prp-green { background: #d1fae5; color: #065f46; }
    .prp-amber { background: #fef3c7; color: #92400e; }
    .prp-red { background: #fee2e2; color: #991b1b; }

    .pr-chips { display: flex; flex-wrap: wrap; gap: 3px; }
    .pr-chip {
      background: #eef2ff; border: 1px solid #c7d2fe; color: #3730a3;

    .pr-msg-score { font-weight: 800; margin-right: auto; }

    .pr-notes-sec { flex: 0 0 auto; }
    .pr-notes-body { columns: 2; column-gap: 7mm; padding: 5px 10px; font-size: 8px; color: #334155; line-height: 1.85; }
    .pr-notes-body b { color: #1e293b; }

    .pr-formula {
      background: #fffbeb; border: 1px solid #fcd34d; border-radius: 5px;

    }
    .pr-formula b { color: #92400e; }

      background: #fef3c7; border: 1px solid #fcd34d; border-radius: 3px;
      padding: 1px 4px; font-family: monospace; color: #78350f; direction: ltr; display: inline-block; font-size: 8px;
    }

    .pr-foot {
      flex: 0 0 auto; display: flex; justify-content: space-between; align-items: center;
      font-size: 7.5px; color: #64748b; border-top: 1px solid #d3d8e0; padding-top: 1.5mm;
    }
    .pr-page-no {
      background: #eef2ff; border: 1px solid #c7d2fe; color: #3730a3;

<body>
  <div id="app"></div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/professor-shared.js"></script>
  <script>
    Chart.defaults.font.family = "Vazirmatn, sans-serif";
    Chart.defaults.color = "#0f172a";
    Chart.defaults.responsive = true;
    Chart.defaults.maintainAspectRatio = false;

    const content = layout.init("professors");
    const urlParams = new URLSearchParams(window.location.search);
    const professorId = urlParams.get("id");
    let PROFILE = null;
    let RANK_INFO = { rank_score: null, position: null, total: null };
    let charts = { sentiment: null, radar: null, aspects: null, timeline: null };

    const BAYES_M = 8;

    function getConfidence(p) {
      if (p.score.confidence_level) return p.score.confidence_level;
      const v = p.score.message_count || 0;
      if (v >= 15) return "high";
      if (v >= 5) return "medium";
      return "low";
    }
    function confFa(level) { return { high: "بالا", medium: "متوسط", low: "پایین" }[level] || "-"; }
    function confBadge(level) {
      if (level === "high")   return '<span class="badge-pill bp-green"><span class="dot"></span>اعتماد بالا</span>';
      if (level === "medium") return '<span class="badge-pill bp-amber"><span class="dot"></span>اعتماد متوسط</span>';
      return '<span class="badge-pill bp-red"><span class="dot"></span>اعتماد پایین</span>';
    }

    function getRankScore(p) {
      if (p.score.rank_score !== null && p.score.rank_score !== undefined) return p.score.rank_score;
      return RANK_INFO.rank_score !== null ? RANK_INFO.rank_score : p.score.overall_score;
    }

    async function computeRankInfo() {
      try {
        const data = await api.getProfessorsRanking();
        const list = (data.professors || []).filter(x => x.overall_score !== null && x.overall_score !== undefined);
        if (!list.length) return;
        const C = list.reduce((s, x) => s + x.overall_score, 0) / list.length;
        const scored = (data.professors || []).map(x => {
          const R = x.overall_score;
          const v = x.message_count || 0;
          const rs = (R === null || R === undefined) ? null : ((v / (v + BAYES_M)) * R + (BAYES_M / (v + BAYES_M)) * C);
          return { id: x.id, rank_score: rs };
        });
        scored.sort((a, b) => (b.rank_score ?? -9999) - (a.rank_score ?? -9999));
        const me = scored.find(x => String(x.id) === String(professorId));
        if (me) {
          RANK_INFO.rank_score = me.rank_score !== null ? Math.round(me.rank_score * 10) / 10 : null;
          RANK_INFO.position = scored.indexOf(me) + 1;
          RANK_INFO.total = scored.length;
        }
      } catch (e) { }
    }

    if (!professorId) {
      content.innerHTML = '<div class="card-x"><div class="empty-state"><i class="fas fa-user-slash"></i><p>استادی مشخص نشده است؛ از صفحه «اساتید و رتبه‌بندی» یک استاد انتخاب کنید.</p></div></div>';
    } else {
      loadProfile();
    }

    async function loadProfile() {
      content.innerHTML = '<div class="card-x"><div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>در حال بارگذاری کارنامه…</p></div></div>';
      try {
        const [profile] = await Promise.all([api.getProfessorProfile(professorId), computeRankInfo()]);
        PROFILE = profile;
        render();
      } catch (err) {
        content.innerHTML = `<div class="card-x"><div class="empty-state"><i class="fas fa-triangle-exclamation"></i><p>خطا در بارگذاری کارنامه: ${err.message}</p></div></div>`;
      }
    }

    function render() {
      const p = PROFILE;
      const s = p.score;
      const st = p.stats;
      const opinionCount = s.message_count || 0;
      const posRate = opinionCount > 0 ? Math.round((s.positive_count / opinionCount) * 100) : 0;
      const negRate = opinionCount > 0 ? Math.round((s.negative_count / opinionCount) * 100) : 0;
      const rankVal = getRankScore(p);
      const realVal = s.overall_score;
      const conf = getConfidence(p);
      const rankLine = RANK_INFO.position ? ` | رتبه ${faNum(RANK_INFO.position)} از ${faNum(RANK_INFO.total)}` : "";

      content.innerHTML = `
        <div class="pf-page">
          <div class="hero">
            <div>
              <h1><i class="fas fa-user-graduate"></i> ${p.name}</h1>
              <p>استادسنج | ${p.department || "بدون دپارتمان"} | بازه نظرات: ${faDate(st.first_date)} تا ${faDate(st.last_date)}${rankLine}</p>
            </div>
            <div class="hero-actions">
              <button class="ghost-btn" id="printBtn"><i class="fas fa-print"></i> پرینت کارنامه</button>
              <button class="ghost-btn" id="regenBtn"><i class="fas fa-rotate"></i> بازتولید خلاصه</button>
              <a class="ghost-btn" href="professors.html"><i class="fas fa-arrow-right"></i> بازگشت</a>
            </div>
          </div>

          <div id="alertArea"></div>

          ${!s.has_enough_data ? `
            <div class="warn-banner">
              <i class="fas fa-triangle-exclamation"></i>
              داده کافی برای امتیازدهی قابل اتکا وجود ندارد (حداقل ۵ نظر واقعی لازم است)؛ اعداد زیر بر اساس ${faNum(opinionCount)} نظر است.
            </div>` : ""}

          ${p.summary ? `
          <div class="card-x">
            <div class="card-x-head">
              <span><i class="fas fa-file-pen"></i>گزارش تحلیلی هوشمند</span>
              <span class="badge-pill bp-violet"><span class="dot"></span>تولید خودکار</span>
            </div>
            <div class="card-x-body">
              <p class="summary-text">${faText(p.summary.summary_text)}</p>
              <div class="sw-grid">
                <div class="sw-box">
                  <div class="sw-title" style="color:#059669;"><i class="fas fa-thumbs-up"></i> نقاط قوت</div>
                  <ul>${(p.summary.strengths || []).map(x => `<li>${faText(x)}</li>`).join("") || "<li>-</li>"}</ul>
                </div>
                <div class="sw-box">
                  <div class="sw-title" style="color:#dc2626;"><i class="fas fa-thumbs-down"></i> نقاط ضعف</div>

    const doughnutLabelsPlugin = {
      id: "doughnutLabels",
      afterDatasetsDraw(chart, args, opts) {
        const fontSize = (opts && opts.fontSize) || 12;
        const minPercent = (opts && opts.minPercent) || 3;
        const meta = chart.getDatasetMeta(0);
        const data = chart.data.datasets[0].data;
        const total = data.reduce((a, b) => a + b, 0);
        if (!total) return;
        const { ctx } = chart;
        meta.data.forEach((arc, i) => {
          const pct = (data[i] / total) * 100;
          if (pct < minPercent) return;
          const p = arc.getProps(["x", "y", "startAngle", "endAngle", "outerRadius", "innerRadius"]);
          const mid = (p.startAngle + p.endAngle) / 2;
          const r = (p.outerRadius + p.innerRadius) / 2;
          ctx.save();
          ctx.fillStyle = "#ffffff";
          ctx.font = `700 ${fontSize}px Vazirmatn, sans-serif`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(`${Math.round(pct)}%`, p.x + Math.cos(mid) * r, p.y + Math.sin(mid) * r);
          ctx.restore();
        });
      }
    };

    function chartBaseOptions(printMode) {
      return {
        responsive: !printMode,
        maintainAspectRatio: false,
        animation: printMode ? false : undefined,
        devicePixelRatio: printMode ? 2 : undefined,
        plugins: {
          legend: { position: "bottom", labels: { padding: printMode ? 8 : 10, font: { size: printMode ? 10 : 11, family: "Vazirmatn" } } },
          tooltip: { rtl: true, textDirection: "rtl" }
        }
      };
    }

    function topAspects() { return (PROFILE.aspects || []).slice(0, 8); }

    function buildSentimentChart(canvas, printMode) {
      const s = PROFILE.score;
      const sd = [s.positive_count || 0, s.negative_count || 0, s.neutral_count || 0, s.mixed_count || 0];
      const opts = chartBaseOptions(printMode);
      opts.plugins.legend = {
        position: "bottom",
        labels: {
          padding: printMode ? 8 : 10,
          font: { size: printMode ? 10 : 11, family: "Vazirmatn" },
          generateLabels: (chart) => {
            const data = chart.data.datasets[0].data;
            const t = data.reduce((a, b) => a + b, 0);
            const meta = chart.getDatasetMeta(0);
            return chart.data.labels.map((label, i) => {
              const style = meta.controller.getStyle(i);
              const pct = t ? Math.round((data[i] / t) * 100) : 0;
              return {
                text: `${label}: ${pct}% (${data[i]})`,
                fillStyle: style.backgroundColor, strokeStyle: style.borderColor,
                lineWidth: style.borderWidth, hidden: !chart.getDataVisibility(i), index: i
              };
            });
          }
        }
      };
      opts.plugins.doughnutLabels = { fontSize: printMode ? 11 : 12, minPercent: 3 };
      return new Chart(canvas, {
        type: "doughnut",
        data: { labels: ["مثبت", "منفی", "خنثی", "مختلط"], datasets: [{ data: sd, backgroundColor: ["#10b981", "#ef4444", "#94a3b8", "#f59e0b"], borderWidth: 2, borderColor: "#fff" }] },
        options: opts,
        plugins: [doughnutLabelsPlugin]
      });
    }

    function buildRadarChart(canvas, printMode) {
      const aspects = topAspects();
      const scores = aspects.map(a => Math.round((a.avg_score || 0) * 100));
      const opts = chartBaseOptions(printMode);
      opts.scales = {
        r: {
          min: -100, max: 100,
          ticks: { stepSize: 50, showLabelBackdrop: false, color: "#94a3b8", font: { size: printMode ? 9 : 10, family: "Vazirmatn" }, callback: v => v + "%" },
          grid: { color: "rgba(100,116,139,.18)" },
          angleLines: { color: "rgba(100,116,139,.18)" },
          pointLabels: { color: "#334155", font: { size: printMode ? 10 : 11, weight: 700, family: "Vazirmatn" }, callback: (label, i) => [label, `${scores[i]}%`] }
        }
      };
      return new Chart(canvas, {
        type: "radar",
        data: {
          labels: aspects.map(a => aspectLabel(a.aspect)),
          datasets: [
            { label: "امتیاز استاد", data: scores, backgroundColor: "rgba(124,58,237,.20)", borderColor: "#7c3aed", borderWidth: 2, pointBackgroundColor: "#7c3aed", pointRadius: printMode ? 4 : 3, pointBorderColor: "#fff", pointBorderWidth: 1 },
            { label: "میانگین (صفر)", data: new Array(aspects.length).fill(0), backgroundColor: "rgba(148,163,184,.08)", borderColor: "rgba(148,163,184,.55)", borderWidth: 1, borderDash: [5, 5], pointRadius: 0 }
          ]

    function buildAspectsChart(canvas, printMode) {
      const aspects = topAspects();
      const scores = aspects.map(a => Math.round((a.avg_score || 0) * 100));
      const opts = chartBaseOptions(printMode);
      opts.indexAxis = "y";
      opts.scales = {

    function buildTimelineChart(canvas, printMode) {

    function captureForPrint(buildFn, w, h) {
      const canvas = document.createElement("canvas");
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
      canvas.style.position = "fixed";
      canvas.style.left = "-99999px";
      canvas.style.top = "0";
      document.body.appendChild(canvas);
      const ch = buildFn(canvas, true);
      const tmp = document.createElement("canvas");
      tmp.width = canvas.width;
      tmp.height = canvas.height;
      const tctx = tmp.getContext("2d");
      tctx.fillStyle = "#ffffff";
      tctx.fillRect(0, 0, tmp.width, tmp.height);
      tctx.drawImage(canvas, 0, 0);
      const url = tmp.toDataURL("image/png");
      ch.destroy();
      canvas.remove();
      return url;
    }

            <div class="pr-charts-grid">
              <img src="${imgs.sentiment}" alt="توزیع احساس‌ها">
              <img src="${imgs.radar}" alt="رادار ابعاد">
              <img src="${imgs.aspects}" alt="مقایسه ابعاد">
              <img src="${imgs.timeline}" alt="روند زمانی">
            </div>
          </div>
        </div>

        <div class="pr-foot">
          <span>استادسنج — سامانه تحلیل نظرات دانشجویان | تولید خودکار</span>
          <span class="pr-page-no">صفحه ۱ از ۲ — ${p.name}</span>
          <span>تاریخ گزارش: ${faNow}</span>
        </div>
      </div>`;
    }

    function prMsgItem(m, type) {
      const scoreClr = type === "positive" ? "#059669" : "#dc2626";
      return `
      <div class="pr-msg">
        <div class="pr-msg-text">${m.text}</div>
        ${m.key_point ? `<div class="pr-msg-kp"><i class="fas fa-quote-right"></i><span>${faText(m.key_point)}</span></div>` : ""}
        <div class="pr-msg-foot">
          ${(m.topics || []).slice(0, 2).map(t => `<span class="pr-msg-chip">${t}</span>`).join("")}
          ${m.reactions ? `<span style="color:#7c3aed;font-weight:700;"><i class="fas fa-face-smile-beam"></i> ${faNum(m.reactions)}</span>` : ""}
          <span>${faDate(m.date)}</span>
          <span class="pr-msg-score" style="color:${scoreClr};">امتیاز: ${faNum(Math.round((m.sentiment_score || 0) * 100), { signed: true })}</span>
        </div>
      </div>`;
    }

    function buildPrintPage2(p) {
      const topics = p.topics || [];
      const sevList = p.high_severity_messages || [];
      const posList = (p.top_positive_messages || []).slice(0, 3);
      const negList = (p.top_negative_messages || []).slice(0, 3);

      const severityRows = sevList.map(m => `
        <tr>
          <td style="text-align:center;">${m.severity === "high" ? '<span class="pr-pill prp-red">بالا</span>' : '<span class="pr-pill prp-amber">متوسط</span>'}</td>
          <td style="text-align:center;">${sentimentFa(m.sentiment)}</td>
          <td>${m.text}</td>
          <td style="text-align:center;white-space:nowrap;">${faDate(m.date)}</td>
        </tr>`).join("");

      return `
      <div class="pr-page">
        <div class="pr-banner pr-banner-sm">
          <div class="pr-brand">
            <span>${p.name}</span>
            <small>پیوست: نظرات برجسته دانشجویان (اصل نظر + تفسیر)، موضوعات پرتکرار، موارد جدی و راهنمای گزارش</small>
          </div>
          <div class="pr-banner-left">استادسنج — صفحهٔ پیوست</div>
        </div>

        <div class="pr-main">
          <div class="pr-col">
            <div class="pr-section pr-flex">
              <div class="pr-section-head"><i class="fas fa-thumbs-up" style="color:#059669;"></i> مثبت‌ترین نظرات دانشجویان <span class="pr-head-note">اصل نظر + تفسیر هوشمند</span></div>
              <div class="pr-section-body" style="padding:0;">
                ${posList.length ? posList.map(m => prMsgItem(m, "positive")).join("") : '<div style="padding:8px;text-align:center;color:#94a3b8;">موردی ثبت نشده است.</div>'}
              </div>
            </div>
            <div class="pr-section pr-flex">
              <div class="pr-section-head"><i class="fas fa-thumbs-down" style="color:#dc2626;"></i> منفی‌ترین نظرات دانشجویان <span class="pr-head-note">اصل نظر + تفسیر هوشمند</span></div>
              <div class="pr-section-body" style="padding:0;">
                ${negList.length ? negList.map(m => prMsgItem(m, "negative")).join("") : '<div style="padding:8px;text-align:center;color:#94a3b8;">موردی ثبت نشده است.</div>'}
              </div>
            </div>
          </div>

          <div class="pr-col">
            <div class="pr-section">
              <div class="pr-section-head"><i class="fas fa-tags"></i> موضوعات پرتکرار <span class="pr-head-note">${faNum(topics.length)} موضوع</span></div>
              <div class="pr-section-body">
                ${topics.length ? `<div class="pr-chips">${topics.map(t => `<span class="pr-chip">${t.topic}<b>${faNum(t.count)}</b></span>`).join("")}</div>` : "موضوعی ثبت نشده است."}
              </div>
            </div>
            <div class="pr-section pr-flex">
              <div class="pr-section-head"><i class="fas fa-exclamation-circle"></i> موارد جدی (شدت متوسط/بالا) <span class="pr-head-note">${faNum(sevList.length)} مورد — بررسی انسانی الزامی</span></div>
              <div class="pr-section-body" style="padding:0;">
                ${sevList.length ? `
                <table class="pr-table">
                  <thead><tr><th style="width:40px;">شدت</th><th style="width:50px;">احساس</th><th>متن پیام</th><th style="width:75px;">تاریخ</th></tr></thead>
                  <tbody>${severityRows}</tbody>
                </table>` : '<div style="padding:8px;text-align:center;color:#94a3b8;">مورد جدی‌ای برای این استاد ثبت نشده است.</div>'}
              </div>
            </div>
          </div>
        </div>

        <div class="pr-section pr-notes-sec">
          <div class="pr-section-head"><i class="fas fa-circle-info"></i> راهنمای خواندن کارنامه و روش محاسبه</div>
          <div class="pr-notes-body">
            <ul>
              <li><b>🏆 امتیاز رتبه‌ای (Bayesian):</b> مبنای اصلی رتبه‌بندی؛ از فرمول میانگین بیزی محاسبه می‌شود تا اساتید کم‌نظر به‌طور ناعادلانه صدرنشین نشوند.
                <div class="pr-formula">
                  <b>فرمول:</b> <code>rank_score = (v / (v + m)) × R + (m / (v + m)) × C</code> —
                  <b>v</b>: تعداد نظرات واقعی | <b>m</b>: ۸ (حداقل اعتماد) | <b>R</b>: امتیاز واقعی استاد | <b>C</b>: میانگین سراسری همه اساتید.
                  با نظرات کم، امتیاز به میانگین جامعه کشیده می‌شود؛ با نظرات زیاد، به امتیاز واقعی نزدیک می‌شود.
                </div>
              </li>
              <li><b>📊 امتیاز واقعی:</b> میانگین وزن‌دار امتیاز احساس نظرات واقعی (وزن هر نظر = اعتماد تحلیل) در بازه ۱۰۰- تا ۱۰۰+؛ برچسب‌ها: عالی (۶۰+)، خوب (۳۰+)، متوسط (۰+)، ضعیف (۳۰-)، خیلی ضعیف (کمتر از ۳۰-).</li>
              <li><b>💬 نظر واقعی در برابر سوال:</b> پیام‌های سوال و اطلاع‌رسانی در امتیاز دخالت ندارند؛ فقط پیام‌های حاوی نظر، ارزیابی، تجربه، شکایت یا توصیه صریح شمرده می‌شوند.</li>
              <li><b>📝 اصل نظر و تفسیر:</b> در بخش نظرات برجسته، متن پررنگ «اصل پیام دانشجو» و خط بنفش زیر آن «تفسیر هوشمند» (خلاصهٔ یک‌خطی نظر) است؛ این دو هرگز با هم ترکیب نمی‌شوند.</li>
              <li><b>📐 ابعاد عملکرد:</b> امتیاز هر بعد، میانگین امتیاز نظراتی است که صریحاً به همان بعد اشاره دارند؛ ابعاد بدون نظر در جدول نمی‌آیند.</li>
              <li><b>🤖 گزارش هوشمند:</b> پاراگراف تحلیلی و نقاط قوت/ضعف/هشدار توسط مدل هوش مصنوعی و صرفاً بر اساس آمار و خلاصه نظرات ثبت‌شده تولید شده است.</li>
              <li><b>⚠️ موارد جدی:</b> اتهاماتی مانند تبعیض، رشوه، توهین یا شکایت جدی با شدت متوسط/بالا علامت‌گذاری می‌شوند؛ بررسی انسانی پیش از هر اقدام اداری الزامی است.</li>
              <li><b>👥 کاربر یکتا:</b> تعداد افراد متمایزی که درباره استاد پیام گذاشته‌اند؛ پیام‌های تکراری یک فرد فقط یک‌بار شمرده می‌شود.</li>
              <li><b>📅 تاریخ‌ها:</b> همه تاریخ‌های این کارنامه شمسی است.</li>
              <li><b>⚖️ سلب مسئولیت:</b> این کارنامه خروجی تحلیل خودکار است؛ برای تصمیم‌های حساس اداری، بررسی انسانی پیام‌های اصلی توصیه می‌شود.</li>
            </ul>
          </div>
        </div>

        <div class="pr-foot">
          <span>استادسنج — پیوست کارنامهٔ ${p.name}</span>
          <span class="pr-page-no">صفحه ۲ از ۲ — ${p.name}</span>
          <span>پایان گزارش</span>
        </div>
      </div>`;
    }

    function makeFileName(base) {
      const now = new Date();
      const faDigits = now.toLocaleDateString("fa-IR-u-nu-latn", { year: "numeric", month: "2-digit", day: "2-digit" }).replace(/\//g, "-");
      return `استادسنج-${base}-${faDigits}`;
    }

    function buildPrintReport() {
      if (!PROFILE) return;
      const p = PROFILE;
      const W = 560, H = 450;
      const imgs = {
        sentiment: captureForPrint(buildSentimentChart, W, H),
        radar: captureForPrint(buildRadarChart, W, H),
        aspects: captureForPrint(buildAspectsChart, W, H),
        timeline: captureForPrint(buildTimelineChart, W, H)
      };
      const html = buildPrintPage1(p, imgs) + buildPrintPage2(p);

      let box = document.getElementById("printReport");
      if (!box) {
        box = document.createElement("div");
        box.id = "printReport";
        document.body.appendChild(box);
      }
      box.innerHTML = html;

      const profNameSafe = p.name.replace(/\s+/g, "-");
      const oldTitle = document.title;
      document.title = makeFileName(`کارنامه-${profNameSafe}`);
      window.print();
      window.addEventListener("afterprint", () => { document.title = oldTitle; }, { once: true });
      setTimeout(() => { document.title = oldTitle; }, 2000);
    }

    async function regenSummary() {
      if (!confirm("خلاصه هوشمند این استاد دوباره تولید شود؟")) return;
      ui.showAlert("در حال تولید خلاصه…", "info");
      try {
        const res = await fetch(`${API_BASE}/api/professors/${professorId}/summary/regenerate?provider=arvan`, { method: "POST" });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          ui.showAlert("خطا: " + (err.detail || res.status), "danger");
          return;
        }
        ui.showAlert("خلاصه با موفقیت تولید شد.", "success");
        loadProfile();
      } catch (err) {
        ui.showAlert("خطا: " + err.message, "danger");
      }
    }
  </script>
</body>
</html>
