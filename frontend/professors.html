<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استادسنج — اساتید و رتبه‌بندی</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>

    .pf-page { display: flex; flex-direction: column; gap: 1.25rem; }
    .hero {

    }
    .hero h1 { font-size: 1.3rem; font-weight: 800; margin: 0 0 .4rem 0; }
    .hero p { margin: 0; opacity: .9; font-size: .87rem; line-height: 1.8; }
    .hero-actions { display: flex; gap: .5rem; flex-wrap: wrap; }
    .ghost-btn {
      background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.35);

    .stat-card {

    .stat-icon { width: 46px; height: 46px; border-radius: .85rem; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0; }
    .si-blue { background: #eff6ff; color: #2563eb; }
    .si-green { background: #ecfdf5; color: #059669; }
    .si-amber { background: #fffbeb; color: #d97706; }

    .toolbar {

    .search-wrap input { padding-right: 2.5rem !important; text-align: right !important; width: 100%; }

    .msg-table thead th {

    table.pr-table { width: 100%; border-collapse: collapse; font-size: 9px; color: #111; }
    .pr-table th, .pr-table td { border: 1px solid #c2c8d4; padding: 3px 6px; text-align: right; vertical-align: middle; }
    .pr-table th { background: linear-gradient(135deg, #4338ca, #6d28d9); color: #fff; font-weight: 800; white-space: nowrap; font-size: 8.5px; }
    .pr-table tbody tr:nth-child(even) td { background: #f6f7fb; }
    .pr-score { font-weight: 800; }

      flex: 0 0 auto; display: flex; justify-content: space-between; align-items: center;

      background: #eef2ff; border: 1px solid #c7d2fe; color: #3730a3;

<body>
  <div id="app"></div>
  <div id="modalRoot"></div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/professor-shared.js"></script>
  <script>
    Chart.defaults.font.family = "Vazirmatn, sans-serif";
    Chart.defaults.color = "#0f172a";
    Chart.defaults.responsive = true;
    Chart.defaults.maintainAspectRatio = false;

    const content = layout.init("professors");
    const state = { search: "", sort: "rank_desc", filter: "all" };
    let allProfessors = [];
    let bayesMap = {};

    const BAYES_M = 8;

    function computeBayes() {
      bayesMap = {};
      const scored = allProfessors.filter(p => p.overall_score !== null && p.overall_score !== undefined);
      if (!scored.length) return;
      const C = scored.reduce((s, p) => s + p.overall_score, 0) / scored.length;
      const entries = allProfessors.map(p => {
        const R = p.overall_score;
        const v = p.message_count || 0;
        const rs = (R === null || R === undefined) ? null : ((v / (v + BAYES_M)) * R + (BAYES_M / (v + BAYES_M)) * C);
        return { id: p.id, rank_score: rs !== null ? Math.round(rs * 10) / 10 : null };
      });
      entries.sort((a, b) => (b.rank_score ?? -9999) - (a.rank_score ?? -9999));
      entries.forEach((e, i) => { bayesMap[e.id] = { rank_score: e.rank_score, position: i + 1, total: entries.length }; });
    }

    function getRankValue(p) {
      if (p.rank_score !== null && p.rank_score !== undefined) return p.rank_score;
      const b = bayesMap[p.id];
      if (b && b.rank_score !== null && b.rank_score !== undefined) return b.rank_score;
      return p.overall_score;
    }
    function getConfidence(p) {
      if (p.confidence_level) return p.confidence_level;
      const v = p.message_count || 0;
      if (v >= 15) return "high";
      if (v >= 5) return "medium";
      return "low";
    }
    function confFa(level) { return { high: "بالا", medium: "متوسط", low: "پایین" }[level] || "-"; }
    function confBadge(level) {
      if (level === "high")   return '<span class="badge-pill bp-green"><span class="dot"></span>اعتماد بالا</span>';
      if (level === "medium") return '<span class="badge-pill bp-amber"><span class="dot"></span>اعتماد متوسط</span>';
      return '<span class="badge-pill bp-red"><span class="dot"></span>اعتماد پایین</span>';
    }
    function rankBadge(id) {
      const b = bayesMap[id];
      if (!b) return '<span class="rank-badge rb-plain">-</span>';
      const r = b.position - 1;
      if (r === 0) return '<span class="rank-badge rb-gold">🥇</span>';
      if (r === 1) return '<span class="rank-badge rb-silver">🥈</span>';
      if (r === 2) return '<span class="rank-badge rb-bronze">🥉</span>';
      return `<span class="rank-badge rb-plain">${faNum(b.position)}</span>`;
    }

    content.innerHTML = `
      <div class="pf-page">
        <div class="hero">
          <div>
            <h1><i class="fas fa-users"></i> اساتید و رتبه‌بندی</h1>
            <p>استادسنج | رتبه‌بندی عادلانه بر اساس میانگین بیزی (امتیاز رتبه‌ای)، همراه با امتیاز واقعی هر استاد</p>
          </div>
          <div class="hero-actions">
            <button class="ghost-btn" id="printBtn"><i class="fas fa-print"></i> پرینت گزارش رتبه‌بندی</button>
            <button class="ghost-btn" id="groupPrintBtn"><i class="fas fa-file-pdf"></i> دانلود گزارش گروهی</button>
          </div>
        </div>

        <div id="alertArea"></div>

        <div class="stat-grid">
          <div class="stat-card"><div class="stat-icon si-blue"><i class="fas fa-user-graduate"></i></div><div><div class="stat-value" id="stTotal">-</div><div class="stat-label">کل اساتید</div></div></div>
          <div class="stat-card"><div class="stat-icon si-green"><i class="fas fa-circle-check"></i></div><div><div class="stat-value" id="stWithData">-</div><div class="stat-label">داده کافی</div></div></div>

    async function loadRanking() {
      const box = document.getElementById("professorsTable");
      box.innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>در حال بارگذاری…</p></div>';
      try {
        const data = await api.getProfessorsRanking();
        allProfessors = data.professors || [];
        computeBayes();
        renderStats();
        renderTable();
      } catch (err) {
        box.innerHTML = `<div class="empty-state"><i class="fas fa-triangle-exclamation"></i><p>خطا در بارگذاری: ${err.message}</p></div>`;
      }
    }

    function computeStats() {
      const total = allProfessors.length;
      const withData = allProfessors.filter(p => p.has_enough_data).length;
      const lowData = total - withData;
      const scored = allProfessors.filter(p => p.overall_score !== null && p.overall_score !== undefined);
      const avg = scored.length ? Math.round(scored.reduce((s, p) => s + p.overall_score, 0) / scored.length) : null;
      const matches = allProfessors.reduce((s, p) => s + (p.total_matched || 0), 0);
      return { total, withData, lowData, avg, matches };
    }

    function renderStats() {
      const s = computeStats();
      document.getElementById("stTotal").innerHTML = faNum(s.total);
      document.getElementById("stWithData").innerHTML = faNum(s.withData);
      document.getElementById("stLowData").innerHTML = faNum(s.lowData);
      document.getElementById("stAvgScore").innerHTML = s.avg !== null ? faNum(s.avg) : "-";
      document.getElementById("stMatches").innerHTML = faNum(s.matches);
    }

    function renderTable() {
      const box = document.getElementById("professorsTable");
      let rows = [...allProfessors];
      const term = state.search.trim().toLowerCase();
      if (term) rows = rows.filter(p => p.name.toLowerCase().includes(term) || (p.department || "").toLowerCase().includes(term));
      if (state.filter === "with_data")    rows = rows.filter(p => p.has_enough_data);
      if (state.filter === "low_data")     rows = rows.filter(p => !p.has_enough_data);
      if (state.filter === "positive")     rows = rows.filter(p => (p.overall_score || 0) > 0);
      if (state.filter === "high_conf")    rows = rows.filter(p => getConfidence(p) === "high");
      if (state.filter === "medium_conf")  rows = rows.filter(p => getConfidence(p) === "medium");
      if (state.filter === "low_conf")     rows = rows.filter(p => getConfidence(p) === "low");
      rows.sort((a, b) => {
        const av = getRankValue(a), bv = getRankValue(b);
        const an = (av === null || av === undefined) ? -9999 : av;
        const bn = (bv === null || bv === undefined) ? -9999 : bv;
        switch (state.sort) {
          case "rank_desc":      return bn - an;
          case "score_desc":     return (b.overall_score ?? -9999) - (a.overall_score ?? -9999);
          case "score_asc":      return (a.overall_score ?? 9999) - (b.overall_score ?? 9999);
          case "messages_desc":  return (b.total_matched || 0) - (a.total_matched || 0);

    const doughnutLabelsPlugin = {
      id: "doughnutLabels",
      afterDatasetsDraw(chart, args, opts) {
        const fontSize = (opts && opts.fontSize) || 12;
        const minPercent = (opts && opts.minPercent) || 3;
        const meta = chart.getDatasetMeta(0);
        const data = chart.data.datasets[0].data;
        const total = data.reduce((a, b) => a + b, 0);
        if (!total) return;
        const { ctx } = chart;
        meta.data.forEach((arc, i) => {
          const pct = (data[i] / total) * 100;
          if (pct < minPercent) return;
          const p = arc.getProps(["x", "y", "startAngle", "endAngle", "outerRadius", "innerRadius"]);
          const mid = (p.startAngle + p.endAngle) / 2;
          const r = (p.outerRadius + p.innerRadius) / 2;
          ctx.save();
          ctx.fillStyle = "#ffffff";
          ctx.font = `700 ${fontSize}px Vazirmatn, sans-serif`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(`${Math.round(pct)}%`, p.x + Math.cos(mid) * r, p.y + Math.sin(mid) * r);
          ctx.restore();
        });
      }
    };

    function chartBaseOptions(printMode) {
      return {
        responsive: !printMode,
        maintainAspectRatio: false,
        animation: printMode ? false : undefined,
        devicePixelRatio: printMode ? 2 : undefined,
        plugins: {
          legend: { position: "bottom", labels: { padding: printMode ? 8 : 10, font: { size: printMode ? 10 : 11, family: "Vazirmatn" } } },
          tooltip: { rtl: true, textDirection: "rtl" }
        }
      };
    }

    function buildSentimentChart(canvas, printMode, prof) {
      const s = prof.score;
      const sd = [s.positive_count || 0, s.negative_count || 0, s.neutral_count || 0, s.mixed_count || 0];
      const opts = chartBaseOptions(printMode);
      opts.plugins.legend = {
        position: "bottom",
        labels: {
          padding: printMode ? 8 : 10,
          font: { size: printMode ? 10 : 11, family: "Vazirmatn" },
          generateLabels: (chart) => {
            const data = chart.data.datasets[0].data;
            const t = data.reduce((a, b) => a + b, 0);
            const meta = chart.getDatasetMeta(0);
            return chart.data.labels.map((label, i) => {
              const style = meta.controller.getStyle(i);
              const pct = t ? Math.round((data[i] / t) * 100) : 0;
              return {
                text: `${label}: ${pct}% (${data[i]})`,
                fillStyle: style.backgroundColor, strokeStyle: style.borderColor,
                lineWidth: style.borderWidth, hidden: !chart.getDataVisibility(i), index: i
              };
            });
          }
        }
      };
      opts.plugins.doughnutLabels = { fontSize: printMode ? 11 : 12, minPercent: 3 };
      return new Chart(canvas, {
        type: "doughnut",
        data: { labels: ["مثبت", "منفی", "خنثی", "مختلط"], datasets: [{ data: sd, backgroundColor: ["#10b981", "#ef4444", "#94a3b8", "#f59e0b"], borderWidth: 2, borderColor: "#fff" }] },
        options: opts,
        plugins: [doughnutLabelsPlugin]
      });
    }

    function buildRadarChart(canvas, printMode, prof) {
      const aspects = (prof.aspects || []).slice(0, 8);
      const scores = aspects.map(a => Math.round((a.avg_score || 0) * 100));
      const opts = chartBaseOptions(printMode);
      opts.scales = {
        r: {
          min: -100, max: 100,
          ticks: { stepSize: 50, showLabelBackdrop: false, color: "#94a3b8", font: { size: printMode ? 9 : 10, family: "Vazirmatn" }, callback: v => v },
          grid: { color: "rgba(100,116,139,.18)" },
          angleLines: { color: "rgba(100,116,139,.18)" },
          pointLabels: { color: "#334155", font: { size: printMode ? 10 : 11, weight: 700, family: "Vazirmatn" }, callback: (label, i) => [label, `${scores[i]}`] }
        }
      };
      return new Chart(canvas, {
        type: "radar",
        data: {
          labels: aspects.map(a => aspectLabel(a.aspect)),
          datasets: [
            { label: "امتیاز استاد", data: scores, backgroundColor: "rgba(124,58,237,.20)", borderColor: "#7c3aed", borderWidth: 2, pointBackgroundColor: "#7c3aed", pointRadius: printMode ? 4 : 3, pointBorderColor: "#fff", pointBorderWidth: 1 },
            { label: "میانگین (صفر)", data: new Array(aspects.length).fill(0), backgroundColor: "rgba(148,163,184,.08)", borderColor: "rgba(148,163,184,.55)", borderWidth: 1, borderDash: [5, 5], pointRadius: 0 }
          ]
        },
        options: opts
      });
    }

    function buildAspectsChart(canvas, printMode, prof) {

            { type: "line", label: "تعداد نظر", data: aspects.map(a => a.count || 0), borderColor: "#7c3aed", backgroundColor: "rgba(124,58,237,.1)", tension: .4, pointRadius: printMode ? 4 : 3, pointBackgroundColor: "#7c3aed", yAxisID: "y1" }

    function buildTimelineChart(canvas, printMode, prof) {
      const tl = prof.timeline || [];
      const opts = chartBaseOptions(printMode);
      opts.scales = {
        y: { type: "linear", position: "right", min: -100, max: 100, title: { display: true, text: "امتیاز", font: { size: printMode ? 9 : 10, family: "Vazirmatn" } }, ticks: { font: { size: printMode ? 9 : 10 }, callback: v => v }, grid: { color: c => c.tick.value === 0 ? "rgba(15,23,42,.25)" : "rgba(15,23,42,.06)" } },

            { label: "تعداد پیام", data: tl.map(t => t.total || 0), borderColor: "#94a3b8", backgroundColor: "rgba(148,163,184,.1)", tension: .4, fill: false, yAxisID: "y1", borderDash: [5, 5], pointRadius: printMode ? 3 : 2 }

    function captureForPrint(buildFn, w, h, prof) {
      const canvas = document.createElement("canvas");
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
      canvas.style.position = "fixed";
      canvas.style.left = "-99999px";
      canvas.style.top = "0";
      document.body.appendChild(canvas);
      const ch = buildFn(canvas, true, prof);
      const tmp = document.createElement("canvas");
      tmp.width = canvas.width;
      tmp.height = canvas.height;
      const tctx = tmp.getContext("2d");
      tctx.fillStyle = "#ffffff";
      tctx.fillRect(0, 0, tmp.width, tmp.height);
      tctx.drawImage(canvas, 0, 0);
      const url = tmp.toDataURL("image/png");
      ch.destroy();
      canvas.remove();
      return url;
    }

    function insertAndPrint(html, title) {
      let box = document.getElementById("printReport");
      if (!box) {
        box = document.createElement("div");
        box.id = "printReport";
        document.body.appendChild(box);
      }
      box.innerHTML = html;
      const oldTitle = document.title;
      document.title = title;
      window.addEventListener("afterprint", () => {
        document.title = oldTitle;
        box.innerHTML = "";
      }, { once: true });
      setTimeout(() => { window.print(); }, 60);
    }

    function sanitizeFileNamePart(s) {
      return String(s || "")
        .replace(/[\\/:*?"<>|]+/g, "-")
        .replace(/\u200c|\u200f|\u200e/g, "")
        .replace(/\s+/g, "-")
        .replace(/-+/g, "-")
        .replace(/^-+|-+$/g, "");
    }

    function makeFileName(parts) {
      const now = new Date();
      const d = now.toLocaleDateString("fa-IR-u-nu-latn", { year: "numeric", month: "2-digit", day: "2-digit" }).replace(/\//g, "-");
      const clean = (Array.isArray(parts) ? parts : [parts])
        .map(sanitizeFileNamePart)
        .filter(Boolean)
        .join("-");
      return `استادسنج-${clean}-${d}`;
    }

    function makeRankingFileName(count) {
      return makeFileName(["رتبه‌بندی-اساتید", `${count}-استاد`]);
    }

    function makeGroupFileName(dept, count, onlyEnough) {
      const scope = dept === "__all__" ? "همه-گروه‌ها" : dept;
      const parts = ["کارنامه-گروهی", scope, `${count}-استاد`];
      if (onlyEnough) parts.push("داده-کافی");
      return makeFileName(parts);
    }

    async function buildGroupPrintReport() {
      const dept = document.getElementById("grpDept").value;
      const onlyEnough = document.getElementById("grpEnough").checked;
      const progress = document.getElementById("grpProgress");
      const goBtn = document.getElementById("grpGo");

      let list = [...allProfessors];
      if (dept !== "__all__") list = list.filter(p => p.department === dept);
      if (onlyEnough) list = list.filter(p => p.has_enough_data);
      list.sort((a, b) => {
        const av = getRankValue(a), bv = getRankValue(b);
        const an = (av === null || av === undefined) ? -9999 : av;
        const bn = (bv === null || bv === undefined) ? -9999 : bv;
        return bn - an;
      });

      if (!list.length) { ui.showAlert("استادی با این فیلترها یافت نشد.", "warn"); return; }

      goBtn.disabled = true;
      const sections = [];
      try {
        const W = 560, H = 450;
        for (let i = 0; i < list.length; i++) {
          progress.textContent = `در حال ساخت کارنامه ${i + 1} از ${list.length}: ${list[i].name} …`;
          const p = await api.getProfessorProfile(list[i].id);
          const imgs = {
            sentiment: captureForPrint(buildSentimentChart, W, H, p),
            radar: captureForPrint(buildRadarChart, W, H, p),
            aspects: captureForPrint(buildAspectsChart, W, H, p),
            timeline: captureForPrint(buildTimelineChart, W, H, p)
          };
          const b = bayesMap[p.id];
          sections.push(buildPrintPage1(p, imgs, b ? b.position : (i + 1), b ? b.total : list.length));
          sections.push(buildPrintPage2(p));
          await new Promise(r => setTimeout(r, 0));
        }
      } catch (e) {
        ui.showAlert("خطا در ساخت گزارش: " + e.message, "danger");
        goBtn.disabled = false;
        return;
      }

      const html = sections.join("") + notesHtml();
      document.getElementById("modalRoot").innerHTML = "";
      insertAndPrint(html, makeGroupFileName(dept, list.length, onlyEnough));
    }

    document.getElementById("printBtn").addEventListener("click", buildPrintReport);
    document.getElementById("groupPrintBtn").addEventListener("click", openGroupModal);
    document.getElementById("searchInput").addEventListener("input", e => { state.search = e.target.value; renderTable(); });
    document.getElementById("sortSelect").addEventListener("change", e => { state.sort = e.target.value; renderTable(); });
    document.getElementById("filterSelect").addEventListener("change", e => { state.filter = e.target.value; renderTable(); });

    window.editProfessor = async function(id) {
      const prof = allProfessors.find(p => p.id === id);
      if (!prof) return;
      const newName = prompt("نام جدید استاد:", prof.name);
      if (newName === null || newName.trim() === "") return;
      try {
        await api.put(`/api/professors/${id}`, { name: newName.trim(), department: prof.department, aliases: prof.aliases || [] });
        ui.showAlert("نام استاد به‌روزرسانی شد.", "success");
        loadRanking();
      } catch (err) { ui.showAlert("خطا: " + err.message, "danger"); }
    };

    window.deleteProfessor = async function(id) {
      const prof = allProfessors.find(p => p.id === id);
      if (!prof) return;
      if (!confirm(`استاد «${prof.name}» و همه تحلیل‌های مرتبط حذف شوند؟`)) return;
      try {
        await api.deleteProfessor(id);
        ui.showAlert("استاد حذف شد.", "success");
        loadRanking();
      } catch (err) { ui.showAlert("خطا: " + err.message, "danger"); }
    };

    loadRanking();
  </script>
</body>
</html>
